<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
JCCI Electrical Design Toolkit
</title>

<style>

body{

margin:0;
font-family:Segoe UI,sans-serif;
background:#eef2f8;

}

header{

background:#071A35;
color:white;

padding:24px;

display:flex;
justify-content:space-between;

}

nav{

padding:12px;

background:white;

display:flex;
gap:10px;

}

nav button{

padding:10px;

border:none;

border-radius:8px;

cursor:pointer;

}

main{

padding:25px;

}

.hidden{

display:none;

}

.section{

background:white;

padding:25px;

border-radius:12px;

box-shadow:
0 2px 10px rgba(0,0,0,.1);

}

.form-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

input,
select{

width:100%;
padding:10px;

box-sizing:border-box;

}

.actionBtn{

margin-top:20px;

padding:12px 20px;

background:#0066cc;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

.resultBox{

margin-top:25px;

padding:20px;

background:#eef5ff;

border-left:
5px solid #0066cc;

}

</style>

</head>

<body>

<header>

<div>

<h1>

JCCI Electrical Design Toolkit

</h1>

<div>

Professional NEC 2023 Engineering Calculations

</div>

</div>

</header>

<nav>

<button
onclick="showPage('dashboard')">

Dashboard

</button>

<button
onclick="showPage('cableSizing')">

Cable Sizing

</button>

</nav>

<main>

<div id="dashboard"
class="page">

<div class="section">

<h2>

Welcome

</h2>

<p>

Select Cable Sizing to begin.

</p>

</div>

</div>

<div id="cableSizing"
class="page hidden">

<div class="section">

<h2>

Cable Sizing

</h2>

<div class="form-grid">

<div>

<label>

Load (A)

</label>

<input
id="load"
type="number"
placeholder="100">

</div>

<div>

<label>

Terminal Rating

</label>

<select
id="terminalRating">

<option value="60">

60°C

</option>

<option value="75"
selected>

75°C

</option>

<option value="90">

90°C

</option>

</select>

</div>

</div>

<button
class="actionBtn"
onclick="calculateCableSize()">

Calculate

</button>

<div
class="resultBox"
id="resultBox">

Awaiting calculation...

</div>

</div>

</div>

</main>

<script>

const pages =
document.querySelectorAll(".page");

function showPage(id){

pages.forEach(page=>{

page.classList.add("hidden");

});

document
.getElementById(id)
.classList.remove("hidden");

}

</script>

js/nec31016.jsscript>

js/cableSizing.jsscript>

</body>

</html>
